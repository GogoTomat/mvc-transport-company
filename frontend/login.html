<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Транспортная Компания</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0d2a47 0%, #1a4d7a 100%);
        }
        
        .login-card {
            background: white;
            padding: 3rem;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 450px;
            animation: fadeInUp 0.6s ease-out;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .login-title {
            font-size: 2rem;
            color: var(--dark-blue);
            margin-bottom: 0.5rem;
        }
        
        .login-subtitle {
            color: var(--gray-medium);
        }
        
        .login-tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        
        .tab-btn {
            flex: 1;
            padding: 0.75rem;
            border: 2px solid var(--gray-light);
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: var(--transition);
        }
        
        .tab-btn.active {
            background: var(--primary-blue);
            color: white;
            border-color: var(--primary-blue);
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
            animation: fadeIn 0.4s ease-out;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1 class="login-title">🚚 Транспортная Компания</h1>
                <p class="login-subtitle">Система управления перевозками</p>
            </div>
            
            <div id="alertContainer"></div>
            
            <div class="login-tabs">
                <button class="tab-btn active" onclick="switchTab('login')">Вход</button>
                <button class="tab-btn" onclick="switchTab('register')">Регистрация</button>
            </div>
            
            <!-- Login Form -->
            <div id="loginTab" class="tab-content active">
                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label class="form-label">Имя пользователя</label>
                        <input type="text" class="form-control" name="username" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Пароль</label>
                        <input type="password" class="form-control" name="password" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary" style="width: 100%;">
                        Войти
                    </button>
                </form>
                
                <div style="margin-top: 1.5rem; padding: 1rem; background: #f7fafc; border-radius: 8px; font-size: 0.9rem;">
                    <strong>Тестовые аккаунты:</strong><br>
                    Администратор: admin / admin123<br>
                    Менеджер: manager / manager123<br>
                    Диспетчер: dispatcher / dispatcher123
                </div>
            </div>
            
            <!-- Register Form -->
            <div id="registerTab" class="tab-content">
                <form id="registerForm" onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label class="form-label">Имя пользователя</label>
                        <input type="text" class="form-control" name="username" required minlength="3">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" name="email" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Пароль</label>
                        <input type="password" class="form-control" name="password" required minlength="6">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Роль</label>
                        <select class="form-control" name="role" required>
                            <option value="manager">Менеджер</option>
                            <option value="dispatcher">Диспетчер</option>
                        </select>
                    </div>
                    
                    <button type="submit" class="btn btn-accent" style="width: 100%;">
                        Зарегистрироваться
                    </button>
                </form>
            </div>
        </div>
    </div>
    
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script>
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            if (tab === 'login') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('loginTab').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('registerTab').classList.add('active');
            }
        }
        
        async function handleLogin(e) {
            e.preventDefault();
            const form = e.target;
            const formData = new FormData(form);
            
            try {
                const data = await api.login(
                    formData.get('username'),
                    formData.get('password')
                );
                
                localStorage.setItem('access_token', data.access_token);
                
                const user = await api.getCurrentUser();
                localStorage.setItem('user', JSON.stringify(user));
                
                window.location.href = 'index.html';
            } catch (error) {
                showAlert('Ошибка входа: ' + error.message, 'error');
            }
        }
        
        async function handleRegister(e) {
            e.preventDefault();
            const form = e.target;
            const formData = new FormData(form);
            
            const userData = {
                username: formData.get('username'),
                email: formData.get('email'),
                password: formData.get('password'),
                role: formData.get('role')
            };
            
            try {
                await api.register(userData);
                showAlert('Регистрация успешна! Теперь войдите в систему.', 'success');
                switchTab('login');
                form.reset();
            } catch (error) {
                showAlert('Ошибка регистрации: ' + error.message, 'error');
            }
        }
        
        // Redirect if already logged in
        if (localStorage.getItem('access_token')) {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
